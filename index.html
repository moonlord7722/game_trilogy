<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Глазомер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header>
      <button id="exit" type="button">‹ Меню</button>
      <div class="meta"><span id="level"></span><span id="round">1 / 6</span><span id="total">0</span></div>
    </header>

    <h1 id="question"></h1>

    <svg id="stage" viewBox="0 -12 360 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <g id="scale-stage">
      <path class="ink" d="M180 30V215M140 215H220"/>
      <g id="left-pan">
        <path class="rope" d="M0 0L-45 95M0 0L45 95"/>
        <path class="ink" d="M-54 95H54"/>
        <g id="ref" class="art ref" transform="translate(-30 33.5) scale(0.6)"></g>
        <g id="ref-tag" class="tag ref"><rect x="-38" y="102" width="76" height="21" rx="5"/><text y="117" text-anchor="middle"></text></g>
      </g>
      <g id="right-pan">
        <path class="rope" d="M0 0L-45 95M0 0L45 95"/>
        <path class="ink" d="M-54 95H54"/>
        <g id="pile" class="art guess"></g>
        <g id="unit-tag" class="tag true"><rect x="-45" y="102" width="90" height="21" rx="5"/><text y="117" text-anchor="middle"></text></g>
      </g>
      <path id="beam" class="ink" d="M70 30H290"/>
      <circle class="pivot" cx="180" cy="30" r="5"/>
      <g id="lock">
        <rect x="170" y="32" width="20" height="16" rx="3"/>
        <path d="M174 32V27a6 6 0 0 1 12 0v5"/>
      </g>
      </g>
      <g id="speed-stage">
        <path class="ink" d="M8 92H352M8 196H352"/>
        <path class="finish" d="M340 30V92M340 134V196"/>
        <g id="t-ticks"></g>
        <g id="t-ref-pre" class="art ref"></g>
        <g id="t-ghost" class="art guess"></g>
        <g id="t-ref" class="art ref"></g>
        <g id="t-guess" class="art guess"></g>
        <g id="t-ref-tag" class="tag ref"><rect y="97" height="20" rx="5"/><text x="180" y="111" text-anchor="middle"></text></g>
        <g id="t-guess-tag" class="tag true"><rect y="201" height="20" rx="5"/><text x="180" y="215" text-anchor="middle"></text></g>
      </g>
      <g id="size-stage">
        <path class="ink" d="M8 200H352"/>
        <g id="s-ref" class="art ref"></g>
        <g id="s-ghost" class="art guess"></g>
        <g id="s-guess" class="art guess"></g>
        <g id="s-ref-tag" class="tag ref"><rect x="30" y="205" width="124" height="20" rx="5"/><text x="90" y="219" text-anchor="middle"></text></g>
        <g id="s-guess-tag" class="tag true"><rect x="206" y="205" width="124" height="20" rx="5"/><text x="270" y="219" text-anchor="middle"></text></g>
      </g>
    </svg>

    <div id="result" class="plate">
      <p id="verdict"></p>
      <p id="fact"></p>
      <button id="swap" type="button" hidden>Переиграть раунд за видео</button>
    </div>

    <div id="controls">
      <div id="hints">
        <span id="hint-count"></span>
        <button id="hint-ad" type="button" hidden>+1 за видео</button>
        <button type="button" data-hint="weight">Вес</button>
        <button type="button" data-hint="range">Диапазон</button>
        <button type="button" data-hint="hall">Зал</button>
      </div>
      <div class="stepper">
        <button id="minus" type="button" aria-label="Меньше">−</button>
        <div id="count"></div>
        <button id="plus" type="button" aria-label="Больше">+</button>
      </div>
      <input id="slider" type="range" min="0" max="1000" step="1" aria-label="Количество">
    </div>

    <button id="main" type="button">Отпустить весы</button>
  </main>

  <section id="start" class="overlay">
    <div class="card">
      <div class="brand">Глазомер <span class="mode-name">· вес</span></div>
      <div id="modes" class="seg"></div>
      <p class="lead" id="lead"></p>
      <p id="streak"></p>
      <div id="levels" class="seg"></div>
      <p id="level-note"></p>
      <div id="plays">
        <button id="play-daily" type="button"></button>
        <button id="play-free" type="button"></button>
      </div>
      <div id="extras">
        <button id="open-album" type="button" class="ghost"></button>
        <button id="open-settings" type="button" class="ghost" aria-label="Настройки" title="Настройки"><i></i><i></i></button>
      </div>
    </div>
  </section>

  <section id="album" class="overlay" hidden>
    <div class="card">
      <div class="brand">Коллекция <span id="album-count"></span></div>
      <p id="album-next"></p>
      <div id="album-grid"></div>
      <button id="album-back" type="button">Назад</button>
    </div>
  </section>

  <section id="settings" class="overlay" hidden>
    <div class="card">
      <div class="brand">Настройки <span>· цвета предметов</span></div>
      <div id="wheel">
        <div id="wheel-ring"></div>
        <svg id="wheel-view" viewBox="0 0 210 100" aria-hidden="true"></svg>
        <button id="knob-ref" class="knob" type="button" aria-label="Цвет левого предмета">Л</button>
        <button id="knob-guess" class="knob" type="button" aria-label="Цвет правого предмета">П</button>
      </div>
      <p id="color-note">«Л» — левый предмет, «П» — правый. Потяни кружок по кругу или выбери готовую пару.</p>
      <div id="pairs"></div>
      <button id="settings-back" type="button">Готово</button>
    </div>
  </section>

  <section id="summary" class="overlay" hidden>
    <div class="card">
      <div class="brand">Глазомер <span class="mode-name">· вес</span></div>
      <div id="sum-total"></div>
      <p id="sum-meta"></p>
      <div id="sum-squares"></div>
      <ul id="sum-list"></ul>
      <div id="sum-new"></div>
      <button id="share" type="button" class="ghost">Скопировать результат</button>
      <button id="change" type="button" class="ghost">В меню</button>
      <button id="again" type="button">Свободная игра</button>
    </div>
  </section>

  <section id="leave" class="overlay" hidden>
    <div class="card">
      <p class="lead">Выйти в меню? Свободная партия не сохранится.</p>
      <button id="leave-stay" type="button">Остаться</button>
      <button id="leave-go" type="button" class="ghost">Выйти</button>
    </div>
  </section>

  <script src="platform.js"></script>
  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="sizes.js"></script>
  <script src="speeds.js"></script>
  <script src="game.js"></script>
</body>
</html>
