<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Глазомер — проба режима «Скорость»</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Проба механики: отдельная страница, в игру и в архив не входит. */
    #result { margin-top: 0; }
    #s-ghost { opacity: 0.3; }
    .tick { stroke: var(--ink); stroke-width: 1; opacity: 0.35; }
    .finish { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 4; }
    #nums { padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <button id="nums" type="button"></button>
      <div class="meta"><span id="level">Проба «Скорости»</span><span id="round"></span><span id="total">0</span></div>
    </header>

    <h1 id="question"></h1>

    <svg id="stage" viewBox="0 -12 360 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <path class="ink" d="M8 92H352M8 196H352"/>
      <path class="finish" d="M340 30V92M340 134V196"/>
      <g id="ticks"></g>
      <g id="s-ref" class="art ref"></g>
      <g id="s-ghost" class="art guess"></g>
      <g id="s-guess" class="art guess"></g>
      <g id="s-ref-tag" class="tag ref"><rect y="97" height="20" rx="5"/><text y="111" text-anchor="middle"></text></g>
      <g id="s-guess-tag" class="tag true"><rect y="201" height="20" rx="5"/><text y="215" text-anchor="middle"></text></g>
    </svg>

    <div id="result" class="plate">
      <p id="verdict"></p>
      <p id="fact"></p>
    </div>

    <div id="controls">
      <div class="stepper">
        <button id="minus" type="button" aria-label="Медленнее">−</button>
        <div id="count"></div>
        <button id="plus" type="button" aria-label="Быстрее">+</button>
      </div>
      <input id="slider" type="range" min="0" max="1000" step="1" aria-label="Скорость">
    </div>

    <button id="main" type="button">Дать старт</button>
  </main>

  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script>
  (() => {
    // Скорости — наибольшие, в км/ч, черновые: для пробы механики, с источниками не сверены.
    // flip — силуэт смотрит влево и разворачивается по ходу, hop — бежит вприпрыжку.
    const SPEED = {
      'человек': { v: 40, hop: true }, 'лошадь': { v: 70, flip: true, hop: true },
      'слон': { v: 40, flip: true, hop: true }, 'кот': { v: 48, hop: true },
      '«Нива»': { v: 140 }, 'страус': { v: 70, flip: true, hop: true },
      'электросамокат': { v: 25, flip: true }, 'заяц': { v: 70, flip: true, hop: true },
      'лев': { v: 80, flip: true, hop: true }, 'поезд «Сапсан»': { v: 250 },
    };
    // Пары: слева предмет с известной скоростью, справа — тот, кого разгоняет игрок.
    const PAIRS = [['человек', 'лошадь'], ['слон', 'кот'], ['«Нива»', 'страус'], ['электросамокат', 'заяц'], ['лев', 'поезд «Сапсан»']];
    // SPAN — во сколько раз ползунок уводит скорость в каждую сторону от скорости левого предмета.
    const SPAN = 6, ZERO_AT = 2.5, EXACT = 1.03;
    // Дорожка: от X0 до X1, предмет размером ICON; самый быстрый на экране проходит её за T_FAST секунд,
    // отставшего ждут ещё T_WAIT, потом забег начинается заново.
    const X0 = 16, X1 = 340, ICON = 60, LANES = [92, 196], T_FAST = 1.5, T_WAIT = 2.2, T_PAUSE = 0.7;
    const RUN = X1 - X0 - ICON;

    const $ = (id) => document.getElementById(id);
    const all = OBJECTS.concat(EXTRA);
    const get = (name) => ({ ...all.find((o) => o.name === name), ...SPEED[name] });
    const cap = (s) => s.replace(/^«?./, (m) => m.toUpperCase());
    const fmt = (v) => '≈ ' + (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10).toLocaleString('ru-RU') + ' км/ч';

    let idx = 0, total = 0, phase = 'guess', numbers = true;
    let h, u, q = 1, ghost = 0;
    // pos — пройденный путь каждого бегуна в долях дорожки, clock — время от старта забега.
    let pos = [0, 0, 0], clock = 0, lastT = 0;

    $('ticks').innerHTML = LANES.map((y) =>
      Array.from({ length: 11 }, (_, i) => `<path class="tick" d="M${X0 + i * (X1 - X0) / 10} ${y}v5"/>`).join('')).join('');

    function setTag(tag, text, cx) {
      const w = Math.max(60, text.length * 6.9 + 14);
      tag.lastElementChild.textContent = text;
      tag.lastElementChild.setAttribute('x', cx);
      tag.firstElementChild.setAttribute('x', cx - w / 2);
      tag.firstElementChild.setAttribute('width', w);
    }

    function place(g, o, lane, at) {
      const x = X0 + at * RUN, k = ICON / 100;
      const hop = o.hop && at > 0 && at < 1 ? -Math.abs(Math.sin(at * RUN / 9)) * 3 : 0;
      const y = LANES[lane] - ICON + hop;
      g.setAttribute('transform', o.flip ? `translate(${x + ICON} ${y}) scale(${-k} ${k})` : `translate(${x} ${y}) scale(${k})`);
    }

    function show() {
      const open = numbers || phase !== 'guess';
      $('count').innerHTML = open ? `<b>${fmt((phase === 'guess' ? q : u.v / h.v) * h.v)}</b>${u.forms[0]}` : `<b>?</b>${u.forms[0]}`;
      $('count').classList.toggle('true', phase !== 'guess');
      $('s-ref-tag').classList.toggle('off', !open);
      $('nums').textContent = numbers ? 'С числами' : 'Без чисел';
    }

    function start() {
      [h, u] = PAIRS[idx].map(get);
      phase = 'guess'; q = 1; ghost = 0; clock = 0; pos = [0, 0, 0];
      $('round').textContent = `${idx + 1} / ${PAIRS.length}`;
      $('total').textContent = total;
      $('question').innerHTML = `<span class="ref">${cap(h.forms[0])}</span> на полном ходу. С какой скоростью мчится <span class="guess">${u.forms[0]}</span>?`;
      $('s-ref').innerHTML = h.art;
      $('s-guess').innerHTML = u.art;
      $('s-guess').setAttribute('class', 'art guess');
      $('s-ghost').innerHTML = '';
      setTag($('s-ref-tag'), fmt(h.v), 180);
      $('s-guess-tag').classList.add('off');
      $('verdict').textContent = idx ? '' : 'Верхний бежит со своей скоростью. Ползунком разгони или притормози нижнего до настоящей.';
      $('fact').textContent = '';
      $('result').classList.toggle('empty', idx > 0);
      $('controls').classList.remove('off');
      $('slider').value = 500;
      $('main').textContent = 'Дать старт';
      show();
    }

    function setQ(x) {
      if (phase !== 'guess') return;
      q = Math.max(1 / SPAN, Math.min(SPAN, x));
      show();
    }

    function reveal() {
      const truth = u.v / h.v, f = q / truth, off = Math.abs(Math.log(f));
      const score = off < Math.log(EXACT) ? 100 : Math.round(100 * Math.max(0, 1 - off / Math.log(ZERO_AT)));
      phase = 'truth'; ghost = q; clock = 0; pos = [0, 0, 0];
      total += score;
      $('controls').classList.add('off');
      $('main').disabled = true;
      // Ответ игрока остаётся бледной тенью, зелёный силуэт бежит с настоящей скоростью.
      $('s-ghost').innerHTML = u.art;
      $('s-guess').setAttribute('class', 'art true');
      setTag($('s-guess-tag'), fmt(u.v), 180);
      $('s-guess-tag').classList.remove('off');
      show();
      const over = f > 1, x = over ? f : 1 / f;
      const miss = score === 100 ? '' : x < 1.5 ? `${over ? 'Быстрее' : 'Медленнее'} на ${Math.max(1, Math.round(Math.abs(f - 1) * 100))} %`
        : `${over ? 'Быстрее' : 'Медленнее'} в ${(Math.round(x * 10) / 10).toLocaleString('ru-RU')} раза`;
      const word = score === 100 ? 'Точно!' : score >= 70 ? 'Глаз намётан!' : score >= 30 ? (over ? 'Разогнался!' : 'Плетётся!') : 'Мимо!';
      setTimeout(() => {
        $('verdict').textContent = `${word} · +${score}`;
        $('fact').innerHTML = `${miss ? miss + '<br>' : ''}${cap(u.forms[0])} — <b>${fmt(u.v)}</b>`;
        $('result').classList.remove('empty');
        $('total').textContent = total;
        $('main').textContent = idx + 1 < PAIRS.length ? 'Дальше' : 'Сначала';
        $('main').disabled = false;
        phase = 'done';
      }, 1800);
    }

    function frame(t) {
      const dt = Math.min(0.033, (t - lastT) / 1000 || 0);
      lastT = t;
      // Скорости в долях скорости левого: левый, ответ игрока, настоящая.
      const shownQ = phase === 'guess' ? q : u.v / h.v;
      const speeds = [1, shownQ, ghost || 0];
      const top = Math.max(...speeds);
      clock += dt;
      pos = pos.map((p, i) => Math.min(1, p + speeds[i] / top / T_FAST * dt));
      const done = pos.every((p, i) => p >= 1 || !speeds[i]);
      if (clock > T_FAST + T_WAIT + T_PAUSE || (done && clock > 1 / (Math.min(...speeds.filter(Boolean)) / top / T_FAST) + T_PAUSE)) {
        clock = 0; pos = [0, 0, 0];
      }
      place($('s-ref'), h, 0, pos[0]);
      place($('s-guess'), u, 1, pos[1]);
      if (ghost) place($('s-ghost'), u, 1, pos[2]);
      requestAnimationFrame(frame);
    }

    $('slider').addEventListener('input', () => setQ(Math.exp(($('slider').value / 500 - 1) * Math.log(SPAN))));
    [[$('minus'), -1], [$('plus'), 1]].forEach(([b, dir]) => b.addEventListener('click', () => {
      setQ(q * Math.pow(1.04, dir));
      $('slider').value = Math.round((Math.log(q) / Math.log(SPAN) + 1) * 500);
    }));
    $('nums').addEventListener('click', () => { numbers = !numbers; show(); });
    $('main').addEventListener('click', () => {
      if (phase === 'guess') return reveal();
      if (phase !== 'done') return;
      idx = (idx + 1) % PAIRS.length;
      if (!idx) total = 0;
      start();
    });

    start();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
