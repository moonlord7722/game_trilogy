<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Глазомер — обложка</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { width: 800px; height: 470px; overflow: hidden; }
    body { background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px; position: relative; }
    svg { position: absolute; right: 0; top: 0; }
    .text { position: absolute; left: 44px; top: 112px; width: 360px; }
    .name { font-size: 68px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
    .ask {
      margin-top: 26px; padding: 14px 18px;
      border: 3px solid var(--ink); border-radius: 14px; background: var(--paper);
      font-size: 27px; font-weight: 600; line-height: 1.3;
    }
    .ask .ref { color: var(--ref); }
    .ask .guess { color: var(--guess); }
  </style>
</head>
<body>
  <div class="text">
    <div class="name">Глазомер</div>
    <div class="ask">Сколько <span class="guess">котов</span> уравновесят <span class="ref">слона</span>?</div>
  </div>
  <svg id="pic" width="420" height="470" viewBox="0 0 420 470"></svg>
  <script src="../data.js"></script>
  <script src="../data2.js"></script>
  <script src="art.js"></script>
  <script>document.getElementById('pic').innerHTML = scaleArt(228, 112, 0.7);</script>
</body>
</html>
